name: Backtest
# Runs a backtest script from backtests/ and prints the results to the job log.
# Market data hosts are reachable from GitHub's runners but not from Claude's sessions.
on:
  workflow_dispatch:
    inputs:
      script:
        description: Script in backtests/ to run
        required: true

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q yfinance pandas numpy
      - run: python "backtests/${{ inputs.script }}"
