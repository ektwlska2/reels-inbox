name: Ingest reel

# Started by the iPhone shortcut (repository_dispatch) or by hand from the Actions tab.
# The reel's caption, transcript and frames go on a separate `inbox` branch, never on main.
# Once Claude has summarized a reel it rebuilds `inbox` without it (a fresh single commit,
# force-pushed), so the reel's content is gone from the branch and its history.
on:
  repository_dispatch:
    types: [reel]
  workflow_dispatch:
    inputs:
      url:
        description: Instagram reel link
        required: true

# One reel at a time so pushes to the inbox branch never collide.
concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REEL_URL: ${{ github.event.client_payload.url || github.event.inputs.url }}
      OUT_DIR: ${{ github.workspace }}/out
      WHISPER_MODEL: small
      FRAME_EVERY: "2"
      MAX_FRAMES: "45"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and Python packages
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          pip install -r requirements.txt

      - name: Cache the Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Write Instagram cookies (optional)
        env:
          IG_COOKIES: ${{ secrets.IG_COOKIES }}
        run: |
          if [ -n "$IG_COOKIES" ]; then
            printf '%s\n' "$IG_COOKIES" > "$RUNNER_TEMP/cookies.txt"
            echo "IG_COOKIES_FILE=$RUNNER_TEMP/cookies.txt" >> "$GITHUB_ENV"
          fi

      - name: Download, transcribe and grab frames
        id: process
        run: python scripts/process_reel.py "$REEL_URL"

      - name: Add the reel to the inbox branch
        env:
          FOLDER: ${{ steps.process.outputs.folder }}
        run: |
          git config user.name "reels-inbox"
          git config user.email "reels-inbox@users.noreply.github.com"
          if git fetch origin +refs/heads/inbox:refs/remotes/origin/inbox 2>/dev/null; then
            git checkout -B inbox origin/inbox
          else
            git checkout --orphan inbox
            git rm -rfq . && git clean -fdq -e out
          fi
          mkdir -p reels && rm -rf "reels/$FOLDER" && mv "out/$FOLDER" reels/
          git add reels
          git commit -m "Add reel: $FOLDER"
          git push origin inbox
