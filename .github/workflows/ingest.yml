name: Ingest reel

# Started by the iPhone shortcut (repository_dispatch) or by hand from the Actions tab.
# The reel's caption, transcript and frames are stored as a temporary artifact, never
# committed, so nothing about a reel stays in the repo. Claude deletes the artifact once it
# has summarized the reel; anything left unreviewed expires on its own after 90 days.
on:
  repository_dispatch:
    types: [reel]
  workflow_dispatch:
    inputs:
      url:
        description: Instagram reel link
        required: true

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REEL_URL: ${{ github.event.client_payload.url || github.event.inputs.url }}
      OUT_DIR: ${{ github.workspace }}/out
      WHISPER_MODEL: small
      FRAME_EVERY: "2"
      MAX_FRAMES: "45"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and Python packages
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          pip install -r requirements.txt

      - name: Cache the Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Write Instagram cookies (optional)
        env:
          IG_COOKIES: ${{ secrets.IG_COOKIES }}
        run: |
          if [ -n "$IG_COOKIES" ]; then
            printf '%s\n' "$IG_COOKIES" > "$RUNNER_TEMP/cookies.txt"
            echo "IG_COOKIES_FILE=$RUNNER_TEMP/cookies.txt" >> "$GITHUB_ENV"
          fi

      - name: Download, transcribe and grab frames
        id: process
        run: python scripts/process_reel.py "$REEL_URL"

      - name: Store as a temporary artifact
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ steps.process.outputs.folder }}
          path: out/${{ steps.process.outputs.folder }}
          retention-days: 90
          if-no-files-found: error
